# NOTE: The smaller the priority number is, the higher the module priority is.
/**:
  ros__parameters:
    # NOTE: modules which are not set true in the preset is ignored in the slot configuration
    slots:
      # NOTE: array of array is not supported
      - slot1
      - slot2
      - slot3
      - slot4
    slot1:
      - "start_planner"
    slot2:
      # HL FMA 9/8: static_obstacle_avoidance 를 lane_change 아래로 내렸다.
      #   위에 있으면 avoidance 가 후보로 뜨는 순간 lane_change_* 가 후보에서 축출된다(실측 0.7초).
      #   포켓 진입은 lane_change_left 만 할 수 있으므로 그쪽이 우선이어야 한다.
      - "side_shift"
      - "avoidance_by_lane_change"
      - "lane_change_left"
      - "lane_change_right"
      - "static_obstacle_avoidance"
      - "external_request_lane_change_left"
      - "external_request_lane_change_right"
      - "bidirectional_traffic"
      - "direction_change"
    slot3:
      - "goal_planner"
    slot4:
      - "dynamic_obstacle_avoidance"

    external_request_lane_change_left:
      enable_rtc: true   # HL FMA 묶음2: 판단 노드가 승인
      # HL FMA 9/7: false 면 경로상 필수 차선변경이 승인·실행 중일 때 외부요청이 승인 모듈로
      # 승격되지 못해 우회가 영원히 불가능하다(시뮬 detour8 에서 확인). true 로 열어둔다.
      enable_simultaneous_execution_as_approved_module: true
      enable_simultaneous_execution_as_candidate_module: true

    external_request_lane_change_right:
      enable_rtc: true    # HL FMA 9/9: blocked_route_detour 가 승인. 자동승인이면 mandatory 와 싸워 경로가 진동한다(실측 21:03)
      # HL FMA 9/7: false 면 경로상 필수 차선변경이 승인·실행 중일 때 외부요청이 승인 모듈로
      # 승격되지 못해 우회가 영원히 불가능하다(시뮬 detour8 에서 확인). true 로 열어둔다.
      enable_simultaneous_execution_as_approved_module: true
      enable_simultaneous_execution_as_candidate_module: true

    lane_change_left:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: true
      enable_simultaneous_execution_as_candidate_module: true

    lane_change_right:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: true
      enable_simultaneous_execution_as_candidate_module: true

    start_planner:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: true
      enable_simultaneous_execution_as_candidate_module: false

    side_shift:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: false
      enable_simultaneous_execution_as_candidate_module: false

    goal_planner:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: true
      enable_simultaneous_execution_as_candidate_module: false

    static_obstacle_avoidance:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: true
      # HL FMA 9/8: false 면 avoidance 가 후보 풀을 독점해 lane_change_* 가 후보조차 못 된다. 되돌리려면 false
      enable_simultaneous_execution_as_candidate_module: true

    avoidance_by_lane_change:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: false
      enable_simultaneous_execution_as_candidate_module: false

    dynamic_obstacle_avoidance:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: true
      enable_simultaneous_execution_as_candidate_module: true

    sampling_planner:
      enable_module: true
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: false
      enable_simultaneous_execution_as_candidate_module: false

    bidirectional_traffic:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: true
      enable_simultaneous_execution_as_candidate_module: true

    direction_change:
      enable_rtc: false
      enable_simultaneous_execution_as_approved_module: false
      enable_simultaneous_execution_as_candidate_module: false
