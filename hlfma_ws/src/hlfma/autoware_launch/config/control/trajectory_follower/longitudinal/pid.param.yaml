# This file is managed by sync-params workflow.
# DO NOT EDIT THIS FILE DIRECTLY FOR ADDING OR REMOVING FIELDS. Follow these steps:
#
# 1. Modify the param file in the upstream repository.
# 2. Run the sync-params workflow or run `python .github/scripts/sync_params.py control` to update this file.
# 3. If local changes are needed, annotate them with an override marker (see below).
#
# Keys marked with '{OVERRIDE}' or '# {OVERRIDE: reason}' are persisted as variant overrides.
# 'reason' can be any single-line text without braces.
# To keep local changes, annotate fields with '# {OVERRIDE}' or '# {OVERRIDE: reason}'.
#
# Source: https://github.com/autowarefoundation/autoware_universe/blob/ca311943e60290ae386c5f81da9b9ea3325807d4/control/autoware_pid_longitudinal_controller/config/autoware_pid_longitudinal_controller.param.yaml

/**:
  ros__parameters:
    delay_compensation_time: 0.5  # HL FMA 9/12: 0.1 -> 0.5. VTD 제동 응답 시정수 ≈1.2 s 실측(0912_044131 bag 적합). 되돌리려면 0.1 # {OVERRIDE}

    enable_smooth_stop: true
    enable_overshoot_emergency: false # {OVERRIDE}
    enable_large_tracking_error_emergency: true
    enable_slope_compensation: false # HL FMA 9/12: 오르막 8~12%에서 +0.8 m/s² 피드포워드가 초과속도(51 km/h)를 만듦. VTD 는 경사 무관 순가속 실현
    enable_keep_stopped_until_steer_convergence: true

    # state transition
    drive_state_stop_dist: 0.5
    drive_state_offset_stop_dist: 1.0
    stopping_state_stop_dist: 0.49 # {OVERRIDE}
    stopped_state_entry_duration_time: 0.1
    stopped_state_entry_vel: 0.01
    stopped_state_entry_acc: 0.1
    emergency_state_overshoot_stop_dist: 1.5

    # drive state
    kp: 1.0
    ki: 0.1
    kd: 0.0
    max_out: 1.0
    min_out: -1.0
    max_p_effort: 1.0
    min_p_effort: -1.0
    max_i_effort: 0.3
    min_i_effort: -0.3
    max_d_effort: 0.0
    min_d_effort: 0.0
    lpf_vel_error_gain: 0.9
    enable_integration_at_low_speed: true  # HL FMA 묶음1: 저속 재출발 적분
    current_vel_threshold_pid_integration: 0.5
    time_threshold_before_pid_integration: 2.0
    ff_scale_min: 0.5
    ff_scale_max: 2.0
    enable_brake_keeping_before_stop: false
    brake_keeping_acc: -0.2

    # smooth stop state
    smooth_stop_max_strong_acc: -0.5
    smooth_stop_min_strong_acc: -0.8
    smooth_stop_weak_acc: -0.3
    smooth_stop_weak_stop_acc: -0.8
    smooth_stop_strong_stop_acc: -3.4
    smooth_stop_max_fast_vel: 0.5
    smooth_stop_min_running_vel: 0.01
    smooth_stop_min_running_acc: 0.01
    smooth_stop_weak_stop_time: 0.8
    smooth_stop_weak_stop_dist: -0.3
    smooth_stop_strong_stop_dist: -0.5

    # stopped state
    stopped_vel: 0.0
    stopped_acc: -3.4 # denotes pedal position

    # emergency state
    emergency_vel: 0.0
    emergency_acc: -5.0 # denotes acceleration
    emergency_jerk: -3.0

    # acceleration feedback
    lpf_acc_error_gain: 0.98
    acc_feedback_gain: 0.0

    # acceleration limit
    max_acc: 3.0
    min_acc: -3.0  # HL FMA 9/12: -5.0 -> -3.0. 실제 감속은 -2.3 m/s² 에서 포화하므로 그 밖의 명령은 적분 폭주·제동 잔류만 만든다(정지선 11 m 전 정지). 되돌리려면 -5.0

    # jerk limit
    max_jerk: 2.0
    min_jerk: -5.0
    max_acc_cmd_diff: 50.0 # [m/s^2 * s^-1]

    # slope compensation
    lpf_pitch_gain: 0.95
    slope_source: "trajectory_goal_adaptive" # {OVERRIDE} raw_pitch, trajectory_pitch, trajectory_adaptive or trajectory_goal_adaptive
    adaptive_trajectory_velocity_th: 1.0
    max_pitch_rad: 0.1
    min_pitch_rad: -0.1
