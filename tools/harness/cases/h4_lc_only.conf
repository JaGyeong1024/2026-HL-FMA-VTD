# lane_change 단독 검증 — 자차 차선(A) 정지차 4대, 인접 차선 B 비어 있음.
#   avoidance 는 실선을 넘어(항목 6 실선 차로변경 -3) 회피하므로, 가능하면 lane_change 로만 하고 싶다.
#   lane_change 는 라우팅 그래프를 따르므로 실선을 넘지 않고 방향지시등도 정상 동작한다(항목 13).
#
# 0908 실측으로 확인된 것:
#   - lane_change 가 거부하는 조건은 '목표 차선에 정지차가 예측 경로 안에 있을 때'다.
#     자차 차선만 막힌 경우 목표 차선 B 는 비어 있으므로 이 조건에 안 걸린다.
#   - 진짜 걸림돌은 calc_shift_intervals 가 current_lanes.back() 에서 preferred 까지의 횡간격을
#     구하는데, 최종 preferred 가 포켓(왼쪽)이라 우측 방향은 항상 DBL_MAX 가 되는 것이다.
#     -> change_route 로 preferred 를 B 로 바꿔 우측 변경을 '경로상 필수'로 만든다.
# 단계: seg2·seg3 preferred = B (A 가 -64.4/-57.4/-50.3 로 막힌 구간)
#       seg4·seg5 는 원래대로 포켓 -> B->A->P 복귀. A 는 -44.1 이후 뚫려 있고 거기서 교차로까지 44 m.
# 0908: 복귀를 한 칸씩 쪼갠다. seg4 를 포켓(P)으로 두면 B 에서 목표가 2칸 왼쪽이 되고,
#   중간 차선 A 에 -44.1 m 정지차가 있어 "no safe path" 로 끝까지 승인이 안 났다
#   (실측 h4_lc_only_0908_103920: t=28.0 후보 -> t=40.3 no safe path -> t=41.6 정지 삽입).
#   seg4=A 로 두면 B->A 한 칸(-44.1 이후 A 는 비어 있음), seg5 에서 A->포켓 한 칸이 된다.
REROUTE="2=15414 3=15220 4=14890 5=14633"   # 분리시험: seg5 도 A -> 뒤따르는 변경 없음
ROUTE=$HOME/hlfma/route/route_pretest_2.csv
MOCK_ARGS="--x 242.572 --y 146.853 --hdg -1.2430 --z 37.200 --clock move --tl 3 \
--obj-abs 10,295.027,-1.515,40.585,-1.1995,0,4.39,1.81 \
--obj-abs 11,297.467,-8.447,40.780,-1.1831,0,4.39,1.81 \
--obj-abs 13,300.438,-14.665,40.962,-1.1639,0,4.39,1.81 \
--obj-abs 14,302.926,-20.021,41.119,-1.1453,0,4.39,1.81"
RUN_SEC=150
METRIC_ARGS="--lanes"
