# h4_pocket 과 같은 장면. 우회를 preferred_primitive 로 표현하고, 상류 세그먼트에 이웃을 넣어준다.
#
# 0908 실측으로 확정된 것들:
#  - 웨이포인트 방식은 무효: set_route_points 가 이웃을 한 세그먼트로 묶고 그 안의 차선은
#    mission_planner 가 preferred 로 혼자 정한다. 세그먼트 안쪽 웨이포인트는 경로를 안 바꾼다.
#  - static_obstacle_avoidance 를 켜면 lane_change_* 가 승인 풀에 못 올라간다 → preset 에서 껐다.
#  - mission_planner 는 차선변경이 불필요한 구간을 primitive 1개 세그먼트로 만든다(seg0·seg1).
#    거기서는 차선변경이 불가능해 "Ego is far from target lane start" 로 32회 거부됐다.
#    route_handler 는 메시지의 primitive 만 쓰므로(route_handler.cpp:558-570) 이웃을 직접 넣는다.
#
# 차선 대응(successor 실측): 16144→15719→15379(A) / 16249→15750→15414(B) / 16354→15781→15449(C)
# 점유표(A 기준 종방향):
#            seg2 -92.6..-60.4  seg3 -60.4..-50.3  seg4 -50.3..-17.9  seg5 -17.9..0
#   P        차선없음            빈                 빈                 빈
#   A        막힘 -64.4         막힘 -57.4,-50.3    막힘 -44.1         빈
#   B        빈                 막힘 -50.3         막힘 -44.1         빈
#   C        빈                 빈                 빈                 빈
# → C 로 우회(상류 129.5 m 에서 우측 2회), -44.1 m 이후 약 50 m 에서 C→B→A→P 좌측 3회.
# 차선변경 1회 길이 ≈ 준비(v×4.0s) + 횡이동 7.6 m. 복귀 3회를 50 m 에 넣으려면 v≈2 m/s.
# 이번 판은 성립 여부만 보므로 전 구간 2 m/s. 되면 구간별 속도로 나눈다.
REROUTE="0=16354:16144,16249 1=15781:15719,15750 2=15449 3=15233 4=14855"
VEL_LIMIT=2.0
ROUTE=$HOME/hlfma/route/route_pretest_2.csv
MOCK_ARGS="--x 242.572 --y 146.853 --hdg -1.2430 --z 37.200 --clock move --tl 3 \
--obj-abs 10,295.027,-1.515,40.585,-1.1995,0,4.39,1.81 \
--obj-abs 11,297.467,-8.447,40.780,-1.1831,0,4.39,1.81 \
--obj-abs 12,296.979,-15.850,40.955,-1.1647,0,4.39,1.81 \
--obj-abs 13,300.438,-14.665,40.962,-1.1639,0,4.39,1.81 \
--obj-abs 14,302.926,-20.021,41.119,-1.1453,0,4.39,1.81 \
--obj-abs 15,299.745,-21.288,41.114,-1.1458,0,4.39,1.81"
RUN_SEC=230
METRIC_ARGS="--lanes"
EXPECT="C 로 우회 후 포켓(14855/14611) 복귀, 교차로 18858 통과"
