# h4_pocket 과 같은 장면. 우측 우회를 external_request_lane_change_right + RTC 승인(lane_planner)으로,
# 포켓 복귀를 경로 기반 lane_change_left 로 나눠 맡긴다.
#
# 왜 이 분담인가 (0908 코드·실측):
#   calc_shift_intervals 는 current_lanes.back() 에서 preferred 까지의 횡간격을 구한다(calculation.cpp:288).
#   우리 차선열의 끝은 14633(A) 이고 그 preferred 는 14611(P) — 왼쪽이다. 따라서
#     dir=LEFT  : 14633→14611 발견 → 간격 [3.2] → 길이 7.6 m (유한, 정상)
#     dir=RIGHT : 오른쪽으로 B,C,D 를 다 걸어도 preferred 없음 → 빈 벡터 → 길이 DBL_MAX → 후보 전멸
#   즉 경로 기반 lane_change_right 는 'preferred 에서 멀어지는' 우회를 원리적으로 만들 수 없다.
#   그 자리를 메우는 것이 external_request 이고, calculation.cpp:300-306 의 P1 패치가 그 경우에만
#   이웃까지의 횡오프셋을 대신 쓴다.
#
# 전제: preset 에서 static_obstacle_avoidance 를 껐다(켜면 lane_change_* 가 승인 풀에 못 올라감).
# 이 조합(avoidance off + lane_planner)은 0908 이전에 한 번도 돌려본 적이 없다.
# 0908: 상류에서 먼저 B 로만 간다. 한 번에 C 를 목표로 하면 모듈이 s=-147(게이트 54.4m)에서야
# 깨어나고, 그 시점에 목표 차선 B 의 정지차가 96 m 앞이라 충돌 판정에 걸린다(실측 95.9m).
# seg0 목표를 B 로 두면 게이트가 route 시작부터 열리고(B 라인이 16249, 자차 lanelet 과 같은 지점 시작)
# 그때 B 의 정지차는 230 m 밖이라 예측 경로에 안 닿는다. seg2 에서 B->C 는 C 가 비어 있어 걸릴 객체가 없다.
REROUTE="0=16249:16144,16354 1=15750:15719,15781 2=15449 3=15233 4=14960 5=14677"
ROUTE=$HOME/hlfma/route/route_pretest_2.csv
MOCK_ARGS="--x 242.572 --y 146.853 --hdg -1.2430 --z 37.200 --clock move --tl 3 \
--obj-abs 10,295.027,-1.515,40.585,-1.1995,0,4.39,1.81 \
--obj-abs 11,297.467,-8.447,40.780,-1.1831,0,4.39,1.81 \
--obj-abs 12,296.979,-15.850,40.955,-1.1647,0,4.39,1.81 \
--obj-abs 13,300.438,-14.665,40.962,-1.1639,0,4.39,1.81 \
--obj-abs 14,302.926,-20.021,41.119,-1.1453,0,4.39,1.81 \
--obj-abs 15,299.745,-21.288,41.114,-1.1458,0,4.39,1.81"
RUN_SEC=150
METRIC_ARGS="--lanes"
EXPECT="우측 우회로 정지차 6대를 지나 C 차선으로 교차로까지 (복귀는 이 판에서 제외)"
# 전반부 단독 검증: preferred 를 전 구간 C 로 두어 lane_change_left 를 침묵시킨다.
#   0908 실측(h4_pocket_ext_0908_071116): 좌·우 모듈이 동시에 RUNNING 이 되어 서로 반대 방향으로
#   정지를 넣었다 — lane_change_left "maintain distance to front object" 45.2m,
